name: Bug report
description: Report unexpected behavior in PaneGlide.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. For a security vulnerability, use the private reporting link in the issue chooser.
  - type: input
    id: version
    attributes:
      label: PaneGlide version
      description: Open the menu bar icon → About PaneGlide.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: application
    attributes:
      label: Affected application and version
      description: Enter "Not applicable" if this is unrelated to a particular window.
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display setup and relevant settings
      description: For layout issues, include display sizes/scaling, arrangement, selected profile, margins, and size values with their units.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Focus a window…
        2. Press…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include any error shown in the PaneGlide menu or Preferences.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Additional context or screenshots
      description: Optional. Crop private window contents and remove account details or credentials before attaching anything.
